# What the BigWigs packager puts in Obvi Guide's zip. The release workflow makes the ObviGuide folder the checkout's
# root first, so the paths here are inside it.
package-as: ObviGuide

# the changelog is written by hand (CHANGELOG.md in the addon's folder), not made from commit messages
manual-changelog:
  filename: CHANGELOG.md
  markup-type: markdown

# development files stay out of the zip
ignore:
  - docs
  - tools
  - .luarc.json
