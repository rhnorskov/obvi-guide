# What the BigWigs packager puts in Obvi Guide: Professions' zip: only the ObviGuides_Professions folder.
package-as: obvi-guide

move-folders:
  obvi-guide/ObviGuides_Professions: ObviGuides_Professions

ignore:
  - ObviGuide
  - ObviScribe
  - ObviGuides_Dungeons
  - media
  - tools
  - README.md
  - LICENSE
  - .gitattributes
  - ObviGuides_Professions/.luarc.json
