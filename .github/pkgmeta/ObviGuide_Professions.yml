# What the BigWigs packager puts in Obvi Guide: Professions's zip. The release workflow makes the ObviGuide_Professions folder the checkout's
# root first, so the paths here are inside it.
package-as: ObviGuide_Professions

# the changelog is written by hand (CHANGELOG.md in the addon's folder), not made from commit messages
manual-changelog:
  filename: CHANGELOG.md
  markup-type: markdown

# development files stay out of the zip
ignore:
  - .luarc.json
